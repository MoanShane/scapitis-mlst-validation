name: scapitis_mlst
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # Core bioinformatics
  - sra-tools=3.0.5
  - blast=2.13.0
  - mafft=7.490
  - trimal=1.4.1
  - snippy=4.6.0
  - iqtree=2.2.0
  # Assembly
  - shovill=1.1.0
  - spades=3.15
  # Python
  - python=3.9
  - biopython>=1.79
  - numpy>=1.21
  - scipy>=1.7
  - scikit-learn>=1.0
  - pandas>=1.3
  - matplotlib>=3.5
  - networkx>=2.8
  - pip
  - pip:
    - dendropy>=4.5
